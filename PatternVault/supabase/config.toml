# Supabase project config (used by CLI for link + functions deploy)
# See https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:54321"
additional_redirect_urls = ["https://localhost:54321"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Edge Functions (required so deploy knows about them)
# extract-pattern-from-video: YouTube URL -> transcript -> Claude -> pattern JSON
# Called by share extension with Bearer token; verify_jwt = true so only signed-in users can call.
[functions.extract-pattern-from-video]
verify_jwt = true

# delete-account: self-service account deletion. Verifies JWT, then deletes auth user
# with service role; user-owned rows are removed by ON DELETE CASCADE.
[functions.delete-account]
verify_jwt = true

# enrich-pattern: server-side enrichment for non-video pattern imports.
[functions.enrich-pattern]
verify_jwt = true
